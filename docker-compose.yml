# [DevOps] Local full stack. NOT RUN in Phase 1: the build box has no Docker. Phase 1 was verified with
# an embedded Postgres 17 and Apache Fineract 1.16.1 run directly on JDK 25 (see README "Running without Docker").
# Images should be pinned by digest before staging. All passwords below are local-only placeholders.
name: mapema
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-only-postgres
      POSTGRES_DB: mapema
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data", "./infra/docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 5s, retries: 20 }

  fineract:
    image: apache/fineract:1.16.1   # verify tag/digest; Phase 1 used the 1.16.1 binary release
    depends_on: { db: { condition: service_healthy } }
    environment:
      FINERACT_NODE_ID: "1"
      FINERACT_HIKARI_DRIVER_SOURCE_CLASS_NAME: org.postgresql.Driver
      FINERACT_HIKARI_JDBC_URL: jdbc:postgresql://db:5432/fineract_tenants
      FINERACT_HIKARI_USERNAME: postgres
      FINERACT_HIKARI_PASSWORD: local-only-postgres
      FINERACT_DEFAULT_TENANTDB_HOSTNAME: db
      FINERACT_DEFAULT_TENANTDB_PORT: "5432"
      FINERACT_DEFAULT_TENANTDB_UID: postgres
      FINERACT_DEFAULT_TENANTDB_PWD: local-only-postgres
      FINERACT_DEFAULT_TENANTDB_TIMEZONE: Africa/Nairobi
      FINERACT_DEFAULT_TENANTDB_IDENTIFIER: default
      FINERACT_DEFAULT_TENANTDB_NAME: fineract_default
      FINERACT_SERVER_SSL_ENABLED: "false"
      FINERACT_SERVER_PORT: "8443"
    ports: ["8443:8443"]

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: local-only-admin
    volumes: ["./infra/keycloak/mapema-realm.json:/opt/keycloak/data/import/mapema-realm.json:ro"]
    ports: ["8080:8080"]

  api:
    build: { context: ., dockerfile: infra/docker/api.Dockerfile }
    depends_on: { db: { condition: service_healthy } }
    env_file: .env
    environment:
      DATABASE_URL: postgres://mapema_api:local-only-app@db:5432/mapema
      OIDC_ISSUER: http://keycloak:8080/realms/mapema
      DEV_IDP_ENABLED: "false"
      FINERACT_BASE_URL: http://fineract:8443/fineract-provider/api/v1
    ports: ["4000:4000"]

  worker:
    build: { context: ., dockerfile: infra/docker/api.Dockerfile }
    command: ["node", "--enable-source-maps", "apps/worker/dist/main.js"]
    depends_on: { db: { condition: service_healthy } }
    env_file: .env
    environment:
      DATABASE_URL: postgres://mapema_api:local-only-app@db:5432/mapema
      FINERACT_BASE_URL: http://fineract:8443/fineract-provider/api/v1

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      args: { NEXT_PUBLIC_API_URL: "http://localhost:4000", NEXT_PUBLIC_OIDC_ISSUER: "http://localhost:8080/realms/mapema" }
    ports: ["3000:3000"]

volumes:
  pgdata: {}
