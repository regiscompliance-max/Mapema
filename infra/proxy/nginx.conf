# [DevOps + Security Engineer] Reverse proxy in front of the API (go-live, S-12).
# Daraja does not sign B2C callbacks: the last path segment of /v1/webhooks/mpesa/b2c/{result|timeout}/<token>
# authenticates them, so it must never reach an access log. The API masks it in its own logs and errors
# (apps/api/src/common/redact.ts); this file does the same at the edge.
map $request_uri $mapema_safe_uri {
  ~^(?<p>/v1/webhooks/mpesa/b2c/(result|timeout)/)[^/?]+(?<rest>.*)$  "${p}***${rest}";
  default $request_uri;
}
log_format mapema_masked '$remote_addr - [$time_iso8601] "$request_method $mapema_safe_uri $server_protocol" '
                         '$status $body_bytes_sent $request_time "$http_user_agent" rid=$request_id';

server {
  listen 443 ssl;
  http2 on;
  server_name api.staging.example;               # placeholder; real host decided in docs/go-live/staging-plan.md
  ssl_certificate     /etc/nginx/tls/fullchain.pem;
  ssl_certificate_key /etc/nginx/tls/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  access_log /var/log/nginx/mapema-api.log mapema_masked;   # never the default "combined" format
  client_max_body_size 12m;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

  location /v1/webhooks/mpesa/ {
    # optional second layer to MPESA_CALLBACK_ALLOWED_IPS in the API: Safaricom's published callback ranges
    # allow <safaricom-range>; deny all;
    proxy_pass http://127.0.0.1:4000;
    proxy_set_header X-Forwarded-For $remote_addr;   # the API trusts exactly one proxy hop (trust proxy = 1)
    proxy_set_header X-Request-Id $request_id;
  }
  location / {
    proxy_pass http://127.0.0.1:4000;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Request-Id $request_id;
  }
}
