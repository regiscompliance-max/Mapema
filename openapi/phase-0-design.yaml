              schema: { type: array, items: { $ref: '#/components/schemas/PricingVersion' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Admin]
      operationId: createPricingVersion
      summary: Create draft pricing version
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PricingVersionCreate' }
      responses:
        '201':
          description: Draft created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PricingVersion' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/pricing-versions/{pricingVersionId}/cbk-approval:
    parameters:
      - { name: pricingVersionId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Admin]
      operationId: recordCbkApproval
      summary: Record CBK approval reference + letter (required before scheduling)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cbk_approval_ref, cbk_approval_doc_id]
              properties:
                cbk_approval_ref: { type: string }
                cbk_approval_doc_id: { type: string, format: uuid }
      responses:
        '200':
          description: Approved status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PricingVersion' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/pricing-versions/{pricingVersionId}/schedule:
    parameters:
      - { name: pricingVersionId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Admin]
      operationId: proposePricingActivation
      summary: Send customer notices and schedule (effective >= 30 days after notice); maker-checker
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [effective_from]
              properties:
                effective_from: { type: string, format: date }
      responses:
        '202':
          description: Approval request created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalRequest' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/users:
    get:
      tags: [Admin]
      operationId: listUsers
      summary: List users
      parameters:
        - { name: org_id, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/User' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/users/{userId}/roles:
    parameters:
      - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Admin]
      operationId: proposeRoleChange
      summary: Propose role change
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [grant, revoke]
              properties:
                grant: { type: array, items: { $ref: '#/components/schemas/RoleScope' } }
                revoke: { type: array, items: { $ref: '#/components/schemas/RoleScope' } }
                access_expires_at: { type: string, format: date-time }
      responses:
        '202':
          description: Approval request created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/integrations:
    get:
      tags: [Admin]
      operationId: listIntegrations
      summary: Adapter mode (live/sandbox/mock) and health per provider
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    adapter: { type: string, enum: [bank, etims, crb, kyc, esign, sms, email, accounting, crm, mpesa, erp, ledger] }
                    mode: { type: string, enum: [live, sandbox, mock] }
                    provider: { type: string }
                    healthy: { type: boolean }
                    last_error_at: { type: [string, 'null'], format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/dashboards/summary:
    get:
      tags: [Reports and audit]
      operationId: getDashboardSummary
      summary: Get dashboard summary
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  float_cents: { $ref: '#/components/schemas/MoneyCents' }
                  exposure_cents: { $ref: '#/components/schemas/MoneyCents' }
                  float_utilisation_bps: { type: integer }
                  fees_mtd_cents: { $ref: '#/components/schemas/MoneyCents' }
                  losses_ytd_cents: { $ref: '#/components/schemas/MoneyCents' }
                  median_hours_to_payout: { type: number }
                  active_suppliers_per_buyer:
                    type: array
                    items:
                      type: object
                      properties:
                        buyer_id: { type: string, format: uuid }
                        count: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/reports:
    post:
      tags: [Reports and audit]
      operationId: runReport
      summary: Generate CBK return, lender portfolio report, CRB submission file or audit export
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, period_start, period_end]
              properties:
                type: { type: string, enum: [cbk_return, lender_portfolio, crb_submission, audit_export, loan_tape] }
                period_start: { type: string, format: date }
                period_end: { type: string, format: date }
                lender_fund_id: { type: string, format: uuid }
      responses:
        '202':
          description: Report job queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportJob' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/reports/{reportId}:
    parameters:
      - { name: reportId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Reports and audit]
      operationId: getReport
      summary: Get report
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportJob' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/audit-events:
    get:
      tags: [Reports and audit]
      operationId: listAuditEvents
      summary: List audit events
      parameters:
        - { name: entity_type, in: query, schema: { type: string } }
        - { name: entity_id, in: query, schema: { type: string } }
        - { name: actor_user_id, in: query, schema: { type: string, format: uuid } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/AuditEvent' } }
                  next_cursor: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/webhooks/bank:
    post:
      tags: [Webhooks]
      operationId: bankWebhook
      summary: Incoming credits and payout status from partner bank (signature/mTLS verified; idempotent on bank_ref)
      security: [ { webhookSignature: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BankWebhookEvent' }
      responses:
        '204': { description: Accepted }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/webhooks/esign:
    post:
      tags: [Webhooks]
      operationId: esignWebhook
      summary: Esign webhook
      security: [ { webhookSignature: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [envelope_id, status]
              properties:
                envelope_id: { type: string }
                status: { type: string, enum: [sent, viewed, signed, completed, declined, expired] }
                signer_ref: { type: string }
      responses:
        '204': { description: Accepted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/webhooks/kyc:
    post:
      tags: [Webhooks]
      operationId: kycWebhook
      summary: Kyc webhook
      security: [ { webhookSignature: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider_ref, result]
              properties:
                provider_ref: { type: string }
                result: { type: string, enum: [pass, fail, review, error] }
      responses:
        '204': { description: Accepted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

components:
  securitySchemes:
    oidc:
      type: openIdConnect
      openIdConnectUrl: https://auth.mapema.co.ke/realms/mapema/.well-known/openid-configuration
    webhookSignature:
      type: apiKey
      in: header
      name: X-Signature
      description: HMAC-SHA256 of raw body with per-provider secret, plus timestamp header; or mTLS where the bank supports it.

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 128 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    OrgId:
      name: orgId
      in: path
      required: true
      schema: { type: string, format: uuid }
    InvoiceId:
      name: invoiceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AdvanceId:
      name: advanceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ApprovalId:
      name: approvalId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Unauthorized:
      description: Not authenticated, MFA incomplete, or STEP_UP_REQUIRED
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Role not permitted
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Not found (also returned for resources outside caller's scope)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: State conflict
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unprocessable:
      description: Validation failed (e.g. MONEY_NOT_INTEGER_CENTS, CURRENCY_NOT_SUPPORTED, CONSENT_REQUIRED)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooManyRequests:
      description: Rate limited
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    MoneyCents:
      type: integer
      format: int64
      minimum: 0
      description: KES amount in integer cents (KES 1.00 = 100).
    Currency:
      type: string
      const: KES
    Bps:
      type: integer
      minimum: 0
      maximum: 10000
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { type: string, examples: [LIMIT_EXCEEDED, SAME_USER_AS_MAKER, DUPLICATE_INVOICE, CURRENCY_NOT_SUPPORTED] }
        instance: { type: string }
        errors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }
    OrgType:
      type: string
      enum: [buyer, supplier]
    InvoiceStatus:
      type: string
      enum: [draft, awaiting_confirmation, confirmed, on_hold, rejected, ilu_signed, eligible, advance_requested, funded, settled, disputed, cancelled]
    AdvanceStatus:
      type: string
      enum: [requested, approved, released, funded, settled, late, recourse, non_performing, written_off, declined, release_failed, cancelled]
    ApprovalStatus:
      type: string
      enum: [pending, approved, rejected, expired, cancelled]
    PayoutStatus:
      type: string
      enum: [proposed, approved, released, confirmed, failed, returned, cancelled]
    DocType:
      type: string
      enum: [certificate_of_incorporation, cr12, kra_pin_certificate, board_resolution, national_id, passport, selfie, bank_proof, audited_accounts, programme_agreement, master_agreement, deed_of_assignment, ilu, notice_of_assignment, invoice_pdf, invoice_csv, credit_report, demand_letter, receipt, statement, fee_invoice, cbk_approval_letter, audit_export, other]
    ConsentPurpose:
      type: string
      enum: [crb_enquiry_and_reporting, data_sharing_with_buyer, marketing, cross_border_transfer]
    Role:
      type: string
      enum: [buyer_admin, buyer_maker, buyer_checker, supplier_admin, supplier_user, credit, ops, compliance, admin, ceo, auditor, lender]
    RoleScope:
      type: object
      required: [role]
      properties:
        role: { $ref: '#/components/schemas/Role' }
        org_id: { type: [string, 'null'], format: uuid }
    Me:
      type: object
      properties:
        user: { $ref: '#/components/schemas/User' }
        mfa_level: { type: string, enum: [none, mfa, mfa-stepup] }
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        display_name: { type: string }
        mfa_enabled: { type: boolean }
        roles: { type: array, items: { $ref: '#/components/schemas/RoleScope' } }
        access_expires_at: { type: [string, 'null'], format: date-time }
        active: { type: boolean }
    InvitationCreate:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [buyer_admin, buyer_user, supplier, supplier_user, staff, auditor] }
        org_id: { type: string, format: uuid }
        email: { type: string, format: email }
        phone: { type: string, pattern: '^\+254[17][0-9]{8}$' }
        supplier_kra_pin: { type: string, pattern: '^[A-Z][0-9]{9}[A-Z]$' }
        roles: { type: array, items: { $ref: '#/components/schemas/Role' } }
    Invitation:
      type: object
      properties:
        id: { type: string, format: uuid }
        kind: { type: string }
        expires_at: { type: string, format: date-time }
        status: { type: string, enum: [sent, accepted, expired, revoked] }
    LeadCreate:
      type: object
      required: [company_name, contact_name, email, consent_to_contact]
      properties:
        company_name: { type: string }
        contact_name: { type: string }
        role: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        spend_band: { type: string, enum: ['<50M', '50M-200M', '200M-1B', '>1B'] }
        sector_code: { type: string }
        consent_to_contact: { type: boolean, const: true }
        captcha_token: { type: string }
    Organisation:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/OrgType' }
        legal_name: { type: string }
        trading_name: { type: [string, 'null'] }
        kra_pin: { type: string }
        registration_no: { type: string }
        sector_code: { type: [string, 'null'] }
        status: { type: string }
        dispute_freeze: { type: boolean }
        fineract_client_id: { type: [integer, 'null'] }
    OrganisationCreate:
      type: object
      required: [type, legal_name, kra_pin, registration_no]
      properties:
        type: { $ref: '#/components/schemas/OrgType' }
        legal_name: { type: string }
        kra_pin: { type: string, pattern: '^[A-Z][0-9]{9}[A-Z]$' }
        registration_no: { type: string }
        sector_code: { type: string }
    OrganisationUpdate:
      type: object
      properties:
        legal_name: { type: string }
        trading_name: { type: string }
        sector_code: { type: string }
        address: { type: object }
    Person:
      type: object
      properties:
        id: { type: string, format: uuid }
        full_name: { type: string }
        national_id_masked: { type: string, examples: ['****5678'] }
        phone_masked: { type: string }
        email: { type: string }
        is_director: { type: boolean }
        is_beneficial_owner: { type: boolean }
        is_authorised_signatory: { type: boolean }
    PersonCreate:
      type: object
      required: [full_name]
      properties:
        full_name: { type: string }
        id_document_type: { type: string, enum: [national_id, passport, alien_id] }
        national_id: { type: string, writeOnly: true, description: 'Encrypted at rest; never returned' }
        date_of_birth: { type: string, format: date, writeOnly: true }
        phone: { type: string, writeOnly: true }
        email: { type: string, format: email }
        is_director: { type: boolean }
        is_beneficial_owner: { type: boolean }
        is_authorised_signatory: { type: boolean }
    BankAccount:
      type: object
      properties:
        id: { type: string, format: uuid }
        bank_code: { type: string }
        account_name: { type: string }
        account_number_last4: { type: string }
        currency: { $ref: '#/components/schemas/Currency' }
        verified: { type: boolean }
        cooling_off_until: { type: [string, 'null'], format: date-time }
        is_payout_default: { type: boolean }
    BankAccountCreate:
      type: object
      required: [bank_code, account_name, account_number, currency, proof_document_id]
      properties:
        bank_code: { type: string }
        branch_code: { type: string }
        account_name: { type: string }
        account_number: { type: string, writeOnly: true }
        currency: { $ref: '#/components/schemas/Currency' }
        proof_document_id: { type: string, format: uuid }
    CollectionAccount:
      type: object
      properties:
        bank_code: { type: string }
        virtual_account_no: { type: string }
        reference_format: { type: string, examples: ['INV-{invoice_number}'] }
    Document:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/DocType' }
        file_name: { type: string }
        sha256: { type: string }
        scan_status: { type: string, enum: [pending, clean, infected, error] }
        signed_at: { type: [string, 'null'], format: date-time }
        download_url: { type: [string, 'null'], format: uri, description: 'Short-lived (5 min); only when scan_status=clean' }
    KycCheck:
      type: object
      properties:
        id: { type: string, format: uuid }
        check_type: { type: string }
        provider: { type: string }
        result: { type: string, enum: [pending, pass, fail, review, error] }
        checked_at: { type: string, format: date-time }
    Consent:
      type: object
      properties:
        id: { type: string, format: uuid }
        purpose: { $ref: '#/components/schemas/ConsentPurpose' }
        text_version: { type: string }
        granted_at: { type: string, format: date-time }
        withdrawn_at: { type: [string, 'null'], format: date-time }
    CreditCheck:
      type: object
      properties:
        id: { type: string, format: uuid }
        bureau: { type: string }
        score: { type: [integer, 'null'] }
        bureau_ref: { type: string }
        report_document_id: { type: string, format: uuid }
        pulled_at: { type: string, format: date-time }
    BuyerProgrammeCreate:
      type: object
      required: [buyer_id, pricing_version_id, advance_rate_bps, limit_cents, start_date, review_date, rationale]
      properties:
        buyer_id: { type: string, format: uuid }
        pricing_version_id: { type: string, format: uuid }
        advance_rate_bps: { $ref: '#/components/schemas/Bps' }
        limit_cents: { $ref: '#/components/schemas/MoneyCents' }
        start_date: { type: string, format: date }
        review_date: { type: string, format: date }
        rationale: { type: string }
    BuyerProgramme:
      allOf:
        - $ref: '#/components/schemas/BuyerProgrammeCreate'
        - type: object
          properties:
            id: { type: string, format: uuid }
            status: { type: string, enum: [proposed, approved, live, suspended, closed] }
            exposure_cents: { $ref: '#/components/schemas/MoneyCents' }
            headroom_cents: { $ref: '#/components/schemas/MoneyCents' }
    SupplierLink:
      type: object
      properties:
        id: { type: string, format: uuid }
        buyer_id: { type: string, format: uuid }
        supplier_id: { type: string, format: uuid }
        supplier_limit_cents: { $ref: '#/components/schemas/MoneyCents' }
        status: { type: string, enum: [invited, joined, active, suspended, ended] }
    LimitsOverview:
      type: object
      properties:
        float_cents: { $ref: '#/components/schemas/MoneyCents' }
        defaults:
          type: object
          properties:
            buyer_pct_bps: { $ref: '#/components/schemas/Bps' }
            supplier_pct_bps: { $ref: '#/components/schemas/Bps' }
            sector_pct_bps: { $ref: '#/components/schemas/Bps' }
        exposures:
          type: array
          items:
            type: object
            properties:
              subject: { type: string, enum: [buyer, supplier, sector] }
              subject_id: { type: string }
              limit_cents: { $ref: '#/components/schemas/MoneyCents' }
              exposure_cents: { $ref: '#/components/schemas/MoneyCents' }
              headroom_cents: { $ref: '#/components/schemas/MoneyCents' }
    LimitConfigChange:
      type: object
      required: [subject, reason]
      properties:
        subject: { type: string, enum: [buyer, supplier, sector] }
        subject_org_id: { type: [string, 'null'], format: uuid }
        subject_sector_code: { type: [string, 'null'] }
        pct_of_float_bps: { $ref: '#/components/schemas/Bps' }
        absolute_cap_cents: { $ref: '#/components/schemas/MoneyCents' }
        review_date: { type: string, format: date }
        reason: { type: string }
    InvoiceCreate:
      type: object
      required: [supplier_id, buyer_id, invoice_number, issue_date, due_date, amount_cents, currency]
      properties:
        supplier_id: { type: string, format: uuid }
        buyer_id: { type: string, format: uuid }
        invoice_number: { type: string, maxLength: 64 }
        etims_cu_invoice_no: { type: string }
        issue_date: { type: string, format: date }
        due_date: { type: string, format: date }
        amount_cents: { $ref: '#/components/schemas/MoneyCents' }
        currency: { $ref: '#/components/schemas/Currency' }
        po_reference: { type: string }
        pdf_document_id: { type: string, format: uuid }
    Invoice:
      allOf:
        - $ref: '#/components/schemas/InvoiceCreate'
        - type: object
          properties:
            id: { type: string, format: uuid }
            status: { $ref: '#/components/schemas/InvoiceStatus' }
            etims_status: { type: string, enum: [pending, valid, invalid, unavailable, overridden] }
            confirmation_id: { type: [string, 'null'], format: uuid }
            eligibility_reasons: { type: array, items: { type: string } }
    Confirmation:
      type: object
      properties:
        id: { type: string, format: uuid }
        invoice_ids: { type: array, items: { type: string, format: uuid } }
        total_confirmed_cents: { $ref: '#/components/schemas/MoneyCents' }
        set_off_waiver: { type: boolean }
        signing_url: { type: [string, 'null'], format: uri }
        status: { type: string, enum: [pending_signature, signed, declined, expired] }
        ilu_document_id: { type: [string, 'null'], format: uuid }
    PriceBreakdown:
      type: object
      required: [invoice_amount_cents, days, advance_cents, discount_fee_cents, verification_fee_cents, total_cost_cents, mapema_keeps_cents, supplier_balance_cents, apr_bps]
      properties:
        invoice_amount_cents: { $ref: '#/components/schemas/MoneyCents' }
        days: { type: integer }
        advance_rate_bps: { $ref: '#/components/schemas/Bps' }
        discount_rate_bps_per_30d: { $ref: '#/components/schemas/Bps' }
        advance_cents: { $ref: '#/components/schemas/MoneyCents' }
        discount_fee_cents: { $ref: '#/components/schemas/MoneyCents' }
        verification_fee_cents: { $ref: '#/components/schemas/MoneyCents' }
        total_cost_cents: { $ref: '#/components/schemas/MoneyCents' }
        mapema_keeps_cents: { $ref: '#/components/schemas/MoneyCents' }
        supplier_balance_cents: { $ref: '#/components/schemas/MoneyCents' }
        apr_bps: { type: integer, description: 'Simple annualised total cost of credit, display only; method to be confirmed with counsel' }
        pricing_version_code: { type: string }
    PriceDisclosure:
      allOf:
        - $ref: '#/components/schemas/PriceBreakdown'
        - type: object
          properties:
            id: { type: string, format: uuid }
            invoice_id: { type: string, format: uuid }
            quote_date: { type: string, format: date }
            due_date: { type: string, format: date }
            terms_version: { type: string }
            kid_version: { type: string }
            expires_at: { type: string, format: date-time }
            fee_note: { type: string, examples: ['Fee is charged for actual days outstanding; the amount shown is the maximum.'] }
    Advance:
      type: object
      properties:
        id: { type: string, format: uuid }
        invoice_id: { type: string, format: uuid }
        supplier_id: { type: string, format: uuid }
        buyer_id: { type: string, format: uuid }
        principal_cents: { $ref: '#/components/schemas/MoneyCents' }
        discount_fee_cents: { $ref: '#/components/schemas/MoneyCents' }
        verification_fee_cents: { $ref: '#/components/schemas/MoneyCents' }
        status: { $ref: '#/components/schemas/AdvanceStatus' }
        fineract_loan_id: { type: [integer, 'null'] }
        disbursed_at: { type: [string, 'null'], format: date-time }
    AdvanceDetail:
      allOf:
        - $ref: '#/components/schemas/Advance'
        - type: object
          properties:
            disclosure: { $ref: '#/components/schemas/PriceDisclosure' }
            checks: { $ref: '#/components/schemas/CheckResults' }
            payouts: { type: array, items: { $ref: '#/components/schemas/Payout' } }
            ledger:
              type: object
              description: Read live from Fineract
              properties:
                principal_outstanding_cents: { $ref: '#/components/schemas/MoneyCents' }
                fees_outstanding_cents: { $ref: '#/components/schemas/MoneyCents' }
                interest_outstanding_cents: { $ref: '#/components/schemas/MoneyCents' }
                as_of: { type: string, format: date-time }
    CheckResults:
      type: object
      properties:
        all_passed: { type: boolean }
        checks:
          type: array
          items:
            type: object
            required: [code, passed]
            properties:
              code: { type: string, enum: [ETIMS_VALID, ILU_SIGNED, NO_DUPLICATE, BUYER_LIMIT, SUPPLIER_LIMIT, SECTOR_LIMIT, FLOAT_AVAILABLE, NO_OPEN_DISPUTE, PARTIES_ACTIVE, KYC_CURRENT, SANCTIONS_CLEAR, PAYOUT_ACCOUNT_VERIFIED, DISCLOSURE_ACCEPTED, PROGRAMME_IN_REVIEW_DATE, LEDGER_PRICE_MATCH] }
              passed: { type: boolean }
              detail: { type: string }
    ApprovalRequest:
      type: object
      properties:
        id: { type: string, format: uuid }
        action: { type: string }
        entity_type: { type: string }
        entity_id: { type: string, format: uuid }
        payload: { type: object }
        required_role: { $ref: '#/components/schemas/Role' }
        maker_id: { type: string, format: uuid }
        checker_id: { type: [string, 'null'], format: uuid }
        status: { $ref: '#/components/schemas/ApprovalStatus' }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
    Payout:
      type: object
      properties:
        id: { type: string, format: uuid }
        advance_id: { type: string, format: uuid }
        type: { type: string, enum: [advance, balance, refund] }
        amount_cents: { $ref: '#/components/schemas/MoneyCents' }
        currency: { $ref: '#/components/schemas/Currency' }
        status: { $ref: '#/components/schemas/PayoutStatus' }
        bank_ref: { type: [string, 'null'] }
        released_by: { type: [string, 'null'], format: uuid }
        approved_by: { type: [string, 'null'], format: uuid }
    Allocation:
      type: object
      properties:
        advance_id: { type: string, format: uuid }
        principal_cents: { $ref: '#/components/schemas/MoneyCents' }
        fees_charges_cents: { $ref: '#/components/schemas/MoneyCents' }
        interest_cents: { $ref: '#/components/schemas/MoneyCents' }
        supplier_balance_cents: { $ref: '#/components/schemas/MoneyCents' }
    Payment:
      type: object
      properties:
        id: { type: string, format: uuid }
        bank_ref: { type: string }
        amount_cents: { $ref: '#/components/schemas/MoneyCents' }
        received_at: { type: string, format: date-time }
        buyer_id: { type: [string, 'null'], format: uuid }
        match_method: { type: [string, 'null'], enum: [auto_reference, auto_amount, auto_sum, manual, null] }
        allocations: { type: array, items: { $ref: '#/components/schemas/Allocation' } }
        unapplied_cents: { $ref: '#/components/schemas/MoneyCents' }
    Dispute:
      type: object
      properties:
        id: { type: string, format: uuid }
        invoice_id: { type: string, format: uuid }
        buyer_id: { type: string, format: uuid }
        reason_code: { type: string }
        status: { type: string, enum: [open, investigating, resolved, withdrawn] }
        opened_at: { type: string, format: date-time }
    Complaint:
      type: object
      properties:
        id: { type: string, format: uuid }
        category: { type: string }
        status: { type: string }
        ack_due_at: { type: string, format: date-time }
        resolve_due_at: { type: string, format: date-time }
    DataSubjectRequest:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { type: string }
        status: { type: string }
        due_at: { type: string, format: date-time }
    ReconciliationRun:
      type: object
      properties:
        id: { type: string, format: uuid }
        as_of_date: { type: string, format: date }
        bank_balance_cents: { type: integer, format: int64 }
        fineract_cash_cents: { type: integer, format: int64 }
        platform_cash_cents: { type: integer, format: int64 }
        status: { type: string, enum: [balanced, breaks, error] }
        breaks:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              kind: { type: string }
              difference_cents: { type: integer, format: int64 }
              status: { type: string }
    PricingVersionCreate:
      type: object
      required: [code, advance_rate_bps, discount_rate_bps_per_30d, verification_fee_cents]
      properties:
        code: { type: string }
        advance_rate_bps: { $ref: '#/components/schemas/Bps' }
        discount_rate_bps_per_30d: { $ref: '#/components/schemas/Bps' }
        verification_fee_cents: { $ref: '#/components/schemas/MoneyCents' }
        rounding_rule: { type: string, enum: [half_up_cent, half_up_shilling], default: half_up_cent }
        min_days: { type: integer, minimum: 1 }
        max_days: { type: integer, maximum: 365 }
    PricingVersion:
      allOf:
        - $ref: '#/components/schemas/PricingVersionCreate'
        - type: object
          properties:
            id: { type: string, format: uuid }
            status: { type: string, enum: [draft, pending_cbk, approved, scheduled, active, retired] }
            cbk_approval_ref: { type: [string, 'null'] }
            customer_notice_sent_at: { type: [string, 'null'], format: date-time }
            effective_from: { type: [string, 'null'], format: date }
    ReportJob:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { type: string }
        status: { type: string, enum: [queued, running, completed, failed] }
        document_id: { type: [string, 'null'], format: uuid }
        sha256: { type: [string, 'null'] }
    AuditEvent:
      type: object
      properties:
        id: { type: integer, format: int64 }
        occurred_at: { type: string, format: date-time }
        actor_user_id: { type: [string, 'null'], format: uuid }
        action: { type: string }
        entity_type: { type: string }
        entity_id: { type: [string, 'null'] }
        before: { type: [object, 'null'] }
        after: { type: [object, 'null'] }
        ip: { type: [string, 'null'] }
        row_hash: { type: string }
    BankWebhookEvent:
      type: object
      required: [event_type, bank_ref, amount_cents, currency, value_date]
      properties:
        event_type: { type: string, enum: [credit_received, payout_confirmed, payout_failed, payout_returned] }
        bank_ref: { type: string }
        account_no: { type: string }
        amount_cents: { $ref: '#/components/schemas/MoneyCents' }
        currency: { $ref: '#/components/schemas/Currency' }
        value_date: { type: string, format: date }
        narrative: { type: string }
        payer_name: { type: string }
        payout_idempotency_key: { type: string }
