openapi: 3.1.0
info:
  title: Mapema Platform API
  version: 0.1.0-phase0
  summary: Buyer-led supplier early-payment platform (Kenya). Contract-first; Phase 0 draft.
  description: |
    [Solution Architect + Backend Engineer + Technical Writer]

    Conventions
    - All money fields are **integer KES cents** (`*_cents`, int64, >= 0). Any `currency` must be `KES`.
      Non-integer or non-KES input is rejected with 422 (`MONEY_NOT_INTEGER_CENTS`, `CURRENCY_NOT_SUPPORTED`).
    - Rates are integer basis points (`*_bps`; 8000 = 80%, 350 = 3.5%).
    - Dates are ISO 8601 `YYYY-MM-DD` interpreted in East Africa Time (Africa/Nairobi); timestamps are RFC 3339 UTC.
    - Errors use RFC 9457 `application/problem+json`.
    - Every state-changing request that can move money or change limits/pricing/roles requires an
      `Idempotency-Key` header and creates or acts on a maker-checker `ApprovalRequest`.
    - Approve/release endpoints require a fresh MFA step-up: the access token must carry `acr=mfa-stepup`
      issued within the last 5 minutes (enforced by the API; 401 `STEP_UP_REQUIRED` otherwise).
    - Auditor and lender roles may only call GET endpoints (403 otherwise).
    - Ledger balances are read from Apache Fineract; the API never accepts client-supplied balances.
  contact:
    name: Mapema engineering
  license:
    name: Proprietary - Mapema Limited, all rights reserved
    identifier: LicenseRef-Mapema-Proprietary
servers:
  - url: https://api.mapema.co.ke
    description: Production (placeholder)
  - url: https://api.staging.mapema.co.ke
    description: Staging (sandbox adapters)
security:
  - oidc: []
tags:
  - name: Public
    description: Unauthenticated marketing-site endpoints (fee calculator, leads, CBK status).
  - name: Identity
    description: Current user, invitations, MFA and sessions.
  - name: Organisations
    description: Buyer and supplier organisations, people and bank accounts.
  - name: KYC and consent
    description: Identity, KYB and CRB checks and Data Protection Act consents.
  - name: Programmes and limits
    description: Buyer programmes, supplier limits and concentration limits.
  - name: Invoices
    description: Invoice capture, eTIMS validation and buyer maker-checker.
  - name: Confirmations
    description: Irrevocable letters of undertaking (ILU) signed by the buyer.
  - name: Advances
    description: Quotes with full disclosure, acceptance, credit decision and release.
  - name: Approvals
    description: Maker-checker approval requests.
  - name: Payouts
    description: Advance and balance payouts to suppliers.
  - name: Payments
    description: Buyer repayments, matching and CBK-order allocation.
  - name: Collections and disputes
    description: Late ladder, recourse and invoice disputes.
  - name: Customer care
    description: Complaints and data-subject requests.
  - name: Reconciliation
    description: Bank vs Fineract vs platform reconciliation.
  - name: Admin
    description: Pricing (with CBK approval reference), float, lending switch and settings.
  - name: Reports and audit
    description: Portfolio reports, audit log and exports.
  - name: Webhooks
    description: Signed inbound callbacks from bank and e-signature providers.

paths:
  /v1/public/fee-quote:
    post:
      tags: [Public]
      operationId: publicFeeQuote
      summary: Indicative fee calculator (same pricing engine as lending)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invoice_amount_cents, days]
              properties:
                invoice_amount_cents: { $ref: '#/components/schemas/MoneyCents' }
                days: { type: integer, minimum: 1, maximum: 180 }
                currency: { $ref: '#/components/schemas/Currency' }
            example: { invoice_amount_cents: 100000000, days: 48, currency: KES }
      responses:
        '200':
          description: Quote
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PriceBreakdown' }
              example:
                invoice_amount_cents: 100000000
                days: 48
                advance_rate_bps: 8000
                discount_rate_bps_per_30d: 350
                advance_cents: 80000000
                discount_fee_cents: 4480000
                verification_fee_cents: 250000
                total_cost_cents: 4730000
                mapema_keeps_cents: 84730000
                supplier_balance_cents: 15270000
                apr_bps: 4496
                pricing_version_code: STD-DEFAULT
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/public/leads:
    post:
      tags: [Public]
      operationId: createLead
      summary: Buyer "Book a call"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LeadCreate' }
      responses:
        '201': { description: Lead created }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/me:
    get:
      tags: [Identity]
      operationId: getMe
      summary: Current user, roles and org scopes
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/invitations:
    post:
      tags: [Identity]
      operationId: createInvitation
      summary: Invite a buyer user, supplier, staff member or auditor
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvitationCreate' }
      responses:
        '201':
          description: Invitation created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invitation' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/invitations/{token}/accept:
    post:
      tags: [Identity]
      operationId: acceptInvitation
      summary: Accept invitation
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string, minLength: 32 }
      responses:
        '200': { description: Accepted; redirect to IdP registration with MFA enrolment }
        '410': { description: Expired or revoked }

  /v1/organisations:
    get:
      tags: [Organisations]
      operationId: listOrganisations
      summary: List organisations
      parameters:
        - { name: type, in: query, schema: { $ref: '#/components/schemas/OrgType' } }
        - { name: status, in: query, schema: { type: string } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Page of organisations
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Organisation' } }
                  next_cursor: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Organisations]
      operationId: createOrganisation
      summary: Staff create buyer prospect
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrganisationCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Organisation' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/organisations/{orgId}:
    parameters: [ { $ref: '#/components/parameters/OrgId' } ]
    get:
      tags: [Organisations]
      operationId: getOrganisation
      summary: Get organisation
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Organisation' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Organisations]
      operationId: updateOrganisation
      summary: Update KYB details (only before approval; afterwards creates a change request)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrganisationUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Organisation' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/organisations/{orgId}/submit-kyb:
    parameters: [ { $ref: '#/components/parameters/OrgId' } ]
    post:
      tags: [Organisations]
      operationId: submitKyb
      summary: Submit kyb
      responses:
        '202': { description: Submitted for review }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/organisations/{orgId}/people:
    parameters: [ { $ref: '#/components/parameters/OrgId' } ]
    get:
      tags: [Organisations]
      operationId: listPeople
      summary: List people
      responses:
        '200':
          description: People (PII masked)
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Person' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Organisations]
      operationId: addPerson
      summary: Add person
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PersonCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Person' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/organisations/{orgId}/bank-accounts:
    parameters: [ { $ref: '#/components/parameters/OrgId' } ]
    get:
      tags: [Organisations]
      operationId: listBankAccounts
      summary: List bank accounts
      responses:
        '200':
          description: Bank accounts (masked)
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/BankAccount' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Organisations]
      operationId: addBankAccount
      summary: Add/change payout account (step-up; cooling-off; ops call-back verification)
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BankAccountCreate' }
      responses:
        '201':
          description: Created, pending verification
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BankAccount' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/bank-accounts/{bankAccountId}/verify:
    parameters:
      - { name: bankAccountId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Organisations]
      operationId: requestBankAccountVerification
      summary: Ops records call-back verification (creates approval request)
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [method, note]
              properties:
                method: { type: string, enum: [call_back, bank_name_match, letter] }
                note: { type: string }
      responses:
        '202':
          description: Approval request created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/documents/upload-url:
    post:
      tags: [Organisations]
      operationId: createUploadUrl
      summary: Presigned upload URL; file is virus-scanned before becoming available
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [owner_org_id, type, file_name, mime_type, size_bytes, sha256]
              properties:
                owner_org_id: { type: string, format: uuid }
                owner_person_id: { type: string, format: uuid }
                type: { $ref: '#/components/schemas/DocType' }
                file_name: { type: string }
                mime_type: { type: string, enum: [application/pdf, image/jpeg, image/png, text/csv] }
                size_bytes: { type: integer, minimum: 1, maximum: 26214400 }
                sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
      responses:
        '201':
          description: Upload target
          content:
            application/json:
              schema:
                type: object
                properties:
                  document_id: { type: string, format: uuid }
                  upload_url: { type: string, format: uri }
                  expires_at: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/documents/{documentId}:
    parameters:
      - { name: documentId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Organisations]
      operationId: getDocument
      summary: Metadata + short-lived download URL (audited)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Document' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/organisations/{orgId}/kyc-checks:
    parameters: [ { $ref: '#/components/parameters/OrgId' } ]
    get:
      tags: [KYC and consent]
      operationId: listKycChecks
      summary: List kyc checks
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/KycCheck' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [KYC and consent]
      operationId: startKycCheck
      summary: Start ID/liveness, registry, sanctions or bank name-match check via KYC adapter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [check_type]
              properties:
                check_type: { type: string, enum: [id_verification, liveness, company_registry, sanctions_pep, bank_name_match] }
                person_id: { type: string, format: uuid }
      responses:
        '202':
          description: Started (result by webhook)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KycCheck' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/consents:
    get:
      tags: [KYC and consent]
      operationId: listConsents
      summary: List consents
      parameters:
        - { name: person_id, in: query, schema: { type: string, format: uuid } }
        - { name: org_id, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Consent' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [KYC and consent]
      operationId: grantConsent
      summary: Grant consent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purpose, text_version]
              properties:
                person_id: { type: string, format: uuid }
                org_id: { type: string, format: uuid }
                purpose: { $ref: '#/components/schemas/ConsentPurpose' }
                text_version: { type: string }
      responses:
        '201':
          description: Recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Consent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/consents/{consentId}/withdraw:
    parameters:
      - { name: consentId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [KYC and consent]
      operationId: withdrawConsent
      summary: Withdraw consent
      responses:
        '200':
          description: Withdrawn
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Consent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/credit-checks:
    post:
      tags: [KYC and consent]
      operationId: pullCreditReport
      summary: Pull CRB report (requires active CRB consent; 422 CONSENT_REQUIRED otherwise)
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bureau]
              properties:
                subject_org_id: { type: string, format: uuid }
                subject_person_id: { type: string, format: uuid }
                bureau: { type: string, description: 'Configured bureau code (provider TBD)' }
      responses:
        '201':
          description: Report stored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreditCheck' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/buyer-programmes:
    post:
      tags: [Programmes and limits]
      operationId: proposeBuyerProgramme
      summary: Credit proposes limit/rates/review date; creates CEO approval request (four-eyes)
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BuyerProgrammeCreate' }
      responses:
        '202':
          description: Approval request created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/buyer-programmes/{programmeId}:
    parameters:
      - { name: programmeId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Programmes and limits]
      operationId: getBuyerProgramme
      summary: Get buyer programme
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BuyerProgramme' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/supplier-links:
    get:
      tags: [Programmes and limits]
      operationId: listSupplierLinks
      summary: List supplier links
      parameters:
        - { name: buyer_id, in: query, schema: { type: string, format: uuid } }
        - { name: supplier_id, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/SupplierLink' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/supplier-links/{linkId}/limit:
    parameters:
      - { name: linkId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Programmes and limits]
      operationId: proposeSupplierLimit
      summary: Propose supplier limit
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [supplier_limit_cents, reason]
              properties:
                supplier_limit_cents: { $ref: '#/components/schemas/MoneyCents' }
                reason: { type: string }
      responses:
        '202':
          description: Approval request created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/limits:
    get:
      tags: [Programmes and limits]
      operationId: getLimits
      summary: Limit configuration, float and current exposure/headroom
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LimitsOverview' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Programmes and limits]
      operationId: proposeLimitChange
      summary: Propose limit change
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LimitConfigChange' }
      responses:
        '202':
          description: Approval request created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/float:
    post:
      tags: [Programmes and limits]
      operationId: proposeFloatChange
      summary: Propose float change
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount_cents, basis_note, effective_from]
              properties:
                amount_cents: { $ref: '#/components/schemas/MoneyCents' }
                basis_note: { type: string }
                effective_from: { type: string, format: date-time }
      responses:
        '202':
          description: Approval request created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/invoices:
    get:
      tags: [Invoices]
      operationId: listInvoices
      summary: List invoices
      parameters:
        - { name: buyer_id, in: query, schema: { type: string, format: uuid } }
        - { name: supplier_id, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/InvoiceStatus' } }
        - { name: due_from, in: query, schema: { type: string, format: date } }
        - { name: due_to, in: query, schema: { type: string, format: date } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Invoice' } }
                  next_cursor: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Invoices]
      operationId: createInvoice
      summary: Buyer maker uploads or supplier submits an invoice (eTIMS + duplicate checks)
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvoiceCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invoice' }
        '409':
          description: Duplicate invoice (DUPLICATE_INVOICE)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/invoices/bulk:
    post:
      tags: [Invoices]
      operationId: bulkUploadInvoices
      summary: CSV upload; per-row results
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, contentMediaType: text/csv }
      responses:
        '200':
          description: Row results
          content:
            application/json:
              schema:
                type: object
                properties:
                  created: { type: integer }
                  failed: { type: integer }
                  rows:
                    type: array
                    items:
                      type: object
                      properties:
                        row: { type: integer }
                        invoice_id: { type: [string, 'null'], format: uuid }
