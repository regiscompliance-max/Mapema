components:
  securitySchemes:
    bearer:
      type: "http"
      scheme: "bearer"
      bearerFormat: "JWT"
      description: "API clients: OIDC access token (Keycloak in staging/production; dev IdP locally). amr must include an MFA factor. Not ambient, so no CSRF header."
    session:
      type: "apiKey"
      in: "cookie"
      name: "mapema_sid"
      description: "Browser: opaque session id set by GET /v1/auth/oidc/callback (BFF) or, in development, POST /v1/auth/session (HttpOnly, Secure, SameSite=Strict). Idle 15 min, absolute 8 h."
    csrf:
      type: "apiKey"
      in: "header"
      name: "X-CSRF-Token"
      description: "Required with the session cookie on POST/PUT/PATCH/DELETE, together with an allowed Origin. Value from POST/GET /v1/auth/session."
  parameters:
    IdempotencyKey:
      name: "Idempotency-Key"
      in: "header"
      required: true
      schema:
        type: "string"
        minLength: 8
        maxLength: 128
  responses:
    Problem:
      description: "Error (problem+json)"
      content:
        "application/problem+json":
          schema:
            "$ref": "#/components/schemas/Problem"
  schemas:
    AnyJson:
      description: "Response body; see the service code for the exact shape."
    Problem:
      type: "object"
      required:
        - "type"
        - "title"
        - "status"
      properties:
        type:
          type: "string"
          format: "uri"
        title:
          type: "string"
          description: "Stable machine-readable error code, e.g. FOUR_EYES, LIMIT_EXCEEDED, STEP_UP_REQUIRED"
        status:
          type: "integer"
        detail:
          type: "string"
        instance:
          type: "string"
        requestId:
          type: "string"
        failedChecks:
          type: "array"
          items:
            type: "object"
